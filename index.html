<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <title>Line Puzzle</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f3ef;
      --board: #786f67;
      --grid: #f7f6f2;
      --route: #ff6266;
      --indicator: #d9d7d1;
      --indicator-on: #ff6266;
      --text: #292825;
      --muted: #77736d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--text); }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 0 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    .game {
      width: min(1120px, calc(100vw - 32px));
      margin: auto;
    }
    .board-wrap { width: 100%; }
    #board {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }
    #board .board-field { fill: var(--board); }
    #board .cell-mark { stroke: none; }
    #board .cell-mark.orange { fill: #e87b3d; }
    #board .cell-mark.pink { fill: #efc9df; }
    #board .grid-line { stroke: var(--grid); stroke-width: 5.5; stroke-linecap: square; }
    #board .blocked { stroke: #aaa9a5; stroke-width: 10; stroke-linecap: butt; }
    #board .triangle { fill: #9dcc55; }
    #board .hex { fill: #10afe1; stroke: #f7f6f2; stroke-width: 1.8; }
    #board .route {
      fill: none;
      stroke: var(--route);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    #board .endpoint { fill: #f8f7f3; }
    #board .endpoint-label {
      fill: #242321;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 21px;
      font-weight: 650;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding-top: 25px;
    }
    .indicators {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(10px, 2.1vw, 22px);
      min-height: 22px;
    }
    .indicator {
      --dot-fill: var(--indicator-on);
      display: block;
      position: relative;
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      border: 1.5px solid #b9b7b1;
      border-radius: 50%;
      background: transparent;
    }
    .indicator.final { --dot-fill: #10afe1; }
    .indicator.on {
      border-color: var(--dot-fill);
      background: var(--dot-fill);
    }
    .indicator.on.cascade {
      animation: indicator-light .24s cubic-bezier(.2, .75, .25, 1) both;
      animation-delay: var(--light-delay, 0ms);
    }
    @keyframes indicator-light {
      0% {
        border-color: #b9b7b1;
        background: transparent;
        transform: scale(.76);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--dot-fill) 0%, transparent);
      }
      62% {
        border-color: var(--dot-fill);
        background: var(--dot-fill);
        transform: scale(1.17);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--dot-fill) 20%, transparent);
      }
      100% {
        border-color: var(--dot-fill);
        background: var(--dot-fill);
        transform: scale(1);
        box-shadow: 0 0 0 0 transparent;
      }
    }
    .indicator.reveal {
      animation: reveal-indicator .68s cubic-bezier(.2, .8, .25, 1) both;
      animation-delay: var(--reveal-delay, 0ms);
    }
    @keyframes reveal-indicator {
      0% { opacity: 0; transform: scale(.12); box-shadow: 0 0 0 0 rgba(16, 175, 225, 0); }
      48% { opacity: 1; transform: scale(1.42); box-shadow: 0 0 0 9px rgba(16, 175, 225, .14); }
      100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 175, 225, 0); }
    }
    .reset-button {
      appearance: none;
      border: 1px solid #aaa79f;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      padding: 8px 17px;
      font-size: 12px;
      line-height: 1.2;
      font-family: inherit;
      letter-spacing: .05em;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease;
    }
    .reset-button:hover { color: var(--text); border-color: #625e57; }
    .reset-button:focus-visible, .clear-button:focus-visible { outline: 2px solid var(--route); outline-offset: 3px; }
    .clear-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 26px;
      background: var(--page);
    }
    .clear-screen[hidden] { display: none; }
    .clear-title {
      margin: 0;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: .13em;
    }
    .clear-button {
      appearance: none;
      border: 1px solid #aaa79f;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      padding: 9px 20px;
      font-size: 12px;
      line-height: 1.2;
      font-family: inherit;
      letter-spacing: .05em;
      cursor: pointer;
    }
    .clear-button:hover { color: var(--text); border-color: #625e57; }
    @media (max-width: 600px) {
      body { padding: 18px 0; }
      .game { width: calc(100vw - 18px); }
      .controls { gap: 18px; padding-top: 19px; }
      .indicator { width: 16px; height: 16px; }
      .indicators { gap: clamp(8px, 2.5vw, 14px); }
      .reset-button { padding: 7px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 1000 600" role="application" aria-label="SからGまで一筆で線を引く盤面" xmlns="http://www.w3.org/2000/svg">
        <g id="field-layer"></g>
        <g id="grid-layer"></g>
        <g id="marker-layer"></g>
        <path id="route" class="route" d=""></path>
        <g id="endpoint-layer"></g>
      </svg>
    </div>
    <div class="controls">
      <div class="indicators" id="indicators" role="group" aria-label="条件の達成状況"></div>
      <button class="reset-button" id="reset" type="button">リセット</button>
    </div>
  </main>

  <section class="clear-screen" id="clear-screen" hidden aria-live="polite">
    <h1 class="clear-title">CLEAR</h1>
    <button class="clear-button" id="play-again" type="button">もう一度</button>
  </section>

  <script>
  (() => {
    'use strict';

    const COLS = 10;
    const ROWS = 6;
    const START = [0, 6];
    const GOAL = [10, 0];
    const ORIGIN = { x: 100, y: 60 };
    const STEP = 80;
    // Keep the junction capture tight so the line follows the pointer instead
    // of being pulled toward a corner from halfway down an edge.
    const SNAP_RADIUS = 21;
    const SNAP_BACK_RADIUS = 24;

    const blockedEdges = [
      [[9, 0], [9, 1]],
      [[4, 5], [4, 6]],
      [[9, 5], [9, 6]]
    ];
    const arrows = [
      { from: [3, 0], to: [4, 0] },
      { from: [1, 1], to: [0, 1] },
      { from: [1, 5], to: [0, 5] },
      { from: [3, 6], to: [4, 6] }
    ];
    const hexagons = [[5, 0], [2, 2], [6, 2], [5, 4]];
    const orangeCells = [[1, 3], [7, 3]];
    const pinkCells = [[7, 1], [8, 1], [9, 1]];
    const boardCorners = [[0, 0], [10, 0], [0, 6], [10, 6]];

    const fieldLayer = document.getElementById('field-layer');
    const gridLayer = document.getElementById('grid-layer');
    const markerLayer = document.getElementById('marker-layer');
    const endpointLayer = document.getElementById('endpoint-layer');
    const board = document.getElementById('board');
    const routeElement = document.getElementById('route');
    const indicatorsElement = document.getElementById('indicators');
    const resetButton = document.getElementById('reset');
    const clearScreen = document.getElementById('clear-screen');
    const playAgainButton = document.getElementById('play-again');

    let path = [];
    let indicatorState = Array(8).fill(false);
    let ninthUnlocked = false;
    let firstPinkSeparated = null;
    let drawing = false;
    let finished = false;
    let activePointerId = null;
    let lastPointerPosition = null;
    let previewPosition = null;
    let renderQueued = false;

    const key = p => `${p[0]},${p[1]}`;
    const same = (a, b) => a[0] === b[0] && a[1] === b[1];
    const adjacent = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
    const point = p => [ORIGIN.x + p[0] * STEP, ORIGIN.y + p[1] * STEP];
    const rotatePoint = p => [COLS - p[0], ROWS - p[1]];

    function svgElement(name, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', name);
      for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, String(value));
      return el;
    }

    function drawBoard() {
      fieldLayer.appendChild(svgElement('rect', {
        x: ORIGIN.x, y: ORIGIN.y, width: COLS * STEP, height: ROWS * STEP,
        class: 'board-field'
      }));

      for (const [x, y] of orangeCells) {
        fieldLayer.appendChild(svgElement('rect', {
          x: ORIGIN.x + x * STEP + 3,
          y: ORIGIN.y + y * STEP + 3,
          width: STEP - 6, height: STEP - 6,
          class: 'cell-mark orange'
        }));
      }
      for (const [x, y] of pinkCells) {
        fieldLayer.appendChild(svgElement('rect', {
          x: ORIGIN.x + x * STEP + 3,
          y: ORIGIN.y + y * STEP + 3,
          width: STEP - 6, height: STEP - 6,
          class: 'cell-mark pink'
        }));
      }

      for (let x = 0; x <= COLS; x++) {
        const px = ORIGIN.x + x * STEP;
        gridLayer.appendChild(svgElement('line', {
          x1: px, y1: ORIGIN.y, x2: px, y2: ORIGIN.y + ROWS * STEP,
          class: 'grid-line'
        }));
      }
      for (let y = 0; y <= ROWS; y++) {
        const py = ORIGIN.y + y * STEP;
        gridLayer.appendChild(svgElement('line', {
          x1: ORIGIN.x, y1: py, x2: ORIGIN.x + COLS * STEP, y2: py,
          class: 'grid-line'
        }));
      }

      for (const [a, b] of blockedEdges) {
        const [x1, y1] = point(a);
        const [x2, y2] = point(b);
        markerLayer.appendChild(svgElement('line', {
          x1, y1, x2, y2, class: 'blocked'
        }));
      }

      for (const { from, to } of arrows) {
        const [x1, y1] = point(from);
        const [x2, y2] = point(to);
        const dx = x2 - x1, dy = y2 - y1;
        const length = Math.hypot(dx, dy);
        const ux = dx / length, uy = dy / length;
        const px = -uy, py = ux;
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const tip = [mx + ux * 12, my + uy * 12];
        const base = [mx - ux * 9, my - uy * 9];
        const left = [base[0] + px * 8, base[1] + py * 8];
        const right = [base[0] - px * 8, base[1] - py * 8];
        markerLayer.appendChild(svgElement('polygon', {
          points: [tip, left, right].map(p => p.join(',')).join(' '),
          class: 'triangle'
        }));
      }

      for (const p of hexagons) {
        const [cx, cy] = point(p);
        const vertices = Array.from({ length: 6 }, (_, i) => {
          const angle = Math.PI / 3 * i - Math.PI / 6;
          return `${cx + 10.5 * Math.cos(angle)},${cy + 10.5 * Math.sin(angle)}`;
        }).join(' ');
        markerLayer.appendChild(svgElement('polygon', { points: vertices, class: 'hex' }));
      }

      for (const { p, label } of [{ p: START, label: 'S' }, { p: GOAL, label: 'G' }]) {
        const [cx, cy] = point(p);
        endpointLayer.appendChild(svgElement('circle', { cx, cy, r: 22, class: 'endpoint' }));
        const text = svgElement('text', { x: cx, y: cy + 1, class: 'endpoint-label' });
        text.textContent = label;
        endpointLayer.appendChild(text);
      }
    }

    function edgeKey(a, b) {
      const ka = key(a), kb = key(b);
      return ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
    }

    function pathEdgeSet(route) {
      const edges = new Set();
      for (let i = 1; i < route.length; i++) edges.add(edgeKey(route[i - 1], route[i]));
      return edges;
    }

    function direction(a, b) { return [b[0] - a[0], b[1] - a[1]]; }

    // Evaluated only once, after the route reaches G.
    function checkRules(route) {
      const visited = new Set(route.map(key));
      const endpointsCorrect = route.length > 1 && same(route[0], START) && same(route[route.length - 1], GOAL);
      const simple = visited.size === route.length;
      const continuous = route.slice(1).every((p, i) => adjacent(route[i], p));
      const rule1 = endpointsCorrect && simple && continuous;
      const edges = pathEdgeSet(route);
      const rule2 = blockedEdges.every(([a, b]) => !edges.has(edgeKey(a, b)));

      // Every triangle must be crossed, in the direction shown by its tip.
      const rule3 = arrows.every(({ from, to }) =>
        route.some((p, i) => i < route.length - 1 && same(p, from) && same(route[i + 1], to))
      );

      let runLength = 1;
      let longestRun = 1;
      for (let i = 2; i < route.length; i++) {
        const before = direction(route[i - 2], route[i - 1]);
        const after = direction(route[i - 1], route[i]);
        runLength = before[0] === after[0] && before[1] === after[1] ? runLength + 1 : 1;
        longestRun = Math.max(longestRun, runLength);
      }
      const rule4 = longestRun <= 3;

      // Each orange tile has four corners; the route must turn at exactly three of them.
      const rule5 = orangeCells.every(([x, y]) => {
        const corners = new Set([key([x, y]), key([x + 1, y]), key([x, y + 1]), key([x + 1, y + 1])]);
        let turns = 0;
        for (let i = 1; i < route.length - 1; i++) {
          if (!corners.has(key(route[i]))) continue;
          const incoming = direction(route[i - 1], route[i]);
          const outgoing = direction(route[i], route[i + 1]);
          if (incoming[0] !== outgoing[0] || incoming[1] !== outgoing[1]) turns++;
        }
        return turns === 3;
      });

      // The four hexagons form two consecutive pairs in route order. Each pair is five steps apart.
      const hexSet = new Set(hexagons.map(key));
      const hexVisits = [];
      route.forEach((p, i) => { if (hexSet.has(key(p))) hexVisits.push(i); });
      const rule6 = hexVisits.length === 4 &&
        hexVisits[1] - hexVisits[0] === 5 &&
        hexVisits[3] - hexVisits[2] === 5;

      const rule7 = boardCorners.every(corner => visited.has(key(corner)));
      const rule8 = route.every((p, i) => same(p, rotatePoint(route[route.length - 1 - i])));

      return [rule1, rule2, rule3, rule4, rule5, rule6, rule7, rule8];
    }

    function pinkIsSeparated(route) {
      const walls = pathEdgeSet(route);
      const remaining = new Set();
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) remaining.add(`${x},${y}`);
      }
      const regions = new Map();
      let regionId = 0;

      function isWall(a, b) {
        const [x, y] = a, [nx, ny] = b;
        let edge;
        if (nx === x + 1) edge = [[x + 1, y], [x + 1, y + 1]];
        else if (nx === x - 1) edge = [[x, y], [x, y + 1]];
        else if (ny === y + 1) edge = [[x, y + 1], [x + 1, y + 1]];
        else edge = [[x, y], [x + 1, y]];
        return walls.has(edgeKey(edge[0], edge[1]));
      }

      while (remaining.size) {
        const first = remaining.values().next().value;
        remaining.delete(first);
        const queue = [first.split(',').map(Number)];
        regions.set(first, regionId);
        while (queue.length) {
          const [x, y] = queue.shift();
          for (const next of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
            const [nx, ny] = next;
            const nextKey = key(next);
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
            if (!remaining.has(nextKey) || isWall([x, y], next)) continue;
            remaining.delete(nextKey);
            regions.set(nextKey, regionId);
            queue.push(next);
          }
        }
        regionId++;
      }

      const pinkRegionIds = pinkCells.map(cell => regions.get(key(cell)));
      return new Set(pinkRegionIds).size > 1;
    }

    function renderIndicators({ revealNinth = false, cascadeCount = 0 } = {}) {
      indicatorsElement.replaceChildren();
      const count = ninthUnlocked ? 9 : 8;
      for (let i = 0; i < count; i++) {
        const dot = document.createElement('span');
        const isOn = Boolean(indicatorState[i]);
        const isNinth = i === 8;
        const shouldCascade = isOn && i < cascadeCount;
        dot.className = `indicator${isNinth ? ' final' : ''}${isOn ? ' on' : ''}${shouldCascade ? ' cascade' : ''}${isNinth && revealNinth ? ' reveal' : ''}`;
        if (shouldCascade) dot.style.setProperty('--light-delay', `${i * 82}ms`);
        if (isNinth && revealNinth) {
          dot.style.setProperty('--reveal-delay', `${cascadeCount * 82 + 165}ms`);
        }
        dot.setAttribute('role', 'img');
        dot.setAttribute('aria-label', `条件 ${i + 1}: ${isOn ? '達成' : '未達成'}`);
        indicatorsElement.appendChild(dot);
      }
    }

    function pointToSvg(event) {
      const p = board.createSVGPoint();
      p.x = event.clientX;
      p.y = event.clientY;
      return p.matrixTransform(board.getScreenCTM().inverse());
    }

    function distance(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

    function candidateNodes(current, pointer, movement) {
      const options = [
        [current[0] + 1, current[1]], [current[0] - 1, current[1]],
        [current[0], current[1] + 1], [current[0], current[1] - 1]
      ].filter(([x, y]) => x >= 0 && x <= COLS && y >= 0 && y <= ROWS);
      const speed = Math.hypot(movement[0], movement[1]);
      const moveUnit = speed ? [movement[0] / speed, movement[1] / speed] : [0, 0];
      const segmentStart = lastPointerPosition || [pointer[0] - movement[0], pointer[1] - movement[1]];
      const vx = pointer[0] - segmentStart[0];
      const vy = pointer[1] - segmentStart[1];
      const segmentLengthSq = vx * vx + vy * vy;
      return options.map(node => {
        const target = point(node);
        const origin = point(current);
        const unit = [(target[0] - origin[0]) / STEP, (target[1] - origin[1]) / STEP];
        const alignment = unit[0] * moveUnit[0] + unit[1] * moveUnit[1];
        const dist = distance(pointer, target);

        // Also measure whether the pointer's actual movement passed close to
        // this junction. This keeps fast drags reliable without enlarging the
        // magnetic snap radius.
        const t = segmentLengthSq > 0
          ? Math.max(0, Math.min(1, ((target[0] - segmentStart[0]) * vx + (target[1] - segmentStart[1]) * vy) / segmentLengthSq))
          : 1;
        const closest = [segmentStart[0] + vx * t, segmentStart[1] + vy * t];
        const sweptDist = distance(closest, target);

        // Direction is only a small tie-breaker, never a long-range pull.
        return {
          node, target, dist, sweptDist, sweptT: t, alignment,
          progress: (pointer[0] - origin[0]) * unit[0] + (pointer[1] - origin[1]) * unit[1],
          score: Math.min(dist, sweptDist) - alignment * 3
        };
      }).sort((a, b) => a.score - b.score);
    }

    function drawRoute() {
      if (!path.length) {
        routeElement.setAttribute('d', '');
        return;
      }
      const points = path.map(point);
      if (drawing && previewPosition) points.push(previewPosition);
      const d = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(' ');
      routeElement.setAttribute('d', d);
    }

    function queueDraw() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        drawRoute();
      });
    }

    function appendNode(node) {
      if (path.some(p => same(p, node))) return false;
      if (!adjacent(path[path.length - 1], node)) return false;
      // Reaching G only places the endpoint. Validation waits for pointerup.
      path.push(node);
      return true;
    }

    function updatePreview(pointer, movement) {
      if (!path.length || !drawing) { previewPosition = null; return; }
      const current = path[path.length - 1];
      if (same(current, GOAL)) { previewPosition = null; return; }
      const candidates = candidateNodes(current, pointer, movement);
      const best = candidates[0];
      if (!best) { previewPosition = null; return; }
      const previous = path.length > 1 ? path[path.length - 2] : null;
      if (previous && same(best.node, previous)) { previewPosition = null; return; }
      if (path.some(p => same(p, best.node))) { previewPosition = null; return; }
      const origin = point(current);
      const dx = (best.target[0] - origin[0]) / STEP;
      const dy = (best.target[1] - origin[1]) / STEP;
      const progress = Math.max(0, Math.min(STEP, best.progress));
      previewPosition = [origin[0] + dx * progress, origin[1] + dy * progress];
    }

    function processPointerPosition(pointer) {
      if (!drawing || finished || !path.length) return;
      const movement = lastPointerPosition
        ? [pointer[0] - lastPointerPosition[0], pointer[1] - lastPointerPosition[1]]
        : [0, 0];
      let guard = 0;
      // Track how far along this pointer movement segment has already been
      // consumed, so a just-crossed junction cannot immediately be undone by
      // the same coalesced movement sample.
      let consumedT = -0.001;

      while (drawing && guard++ < 14) {
        const current = path[path.length - 1];
        if (same(current, GOAL)) break;
        const candidates = candidateNodes(current, pointer, movement);
        const best = candidates[0];
        if (!best) break;

        // Moving back over the previous junction retracts the last segment, as in a physical trace puzzle.
        if (path.length > 1 && same(best.node, path[path.length - 2])) {
          const movedBackAcrossJunction = best.sweptDist <= SNAP_BACK_RADIUS &&
            best.sweptT > consumedT + 0.02 && best.alignment > 0.25;
          if ((best.dist <= SNAP_BACK_RADIUS && best.alignment > 0.25) || movedBackAcrossJunction) {
            consumedT = Math.max(consumedT, best.sweptT);
            path.pop();
            continue;
          }
          break;
        }
        if (path.some(p => same(p, best.node))) break;

        // Capture a junction only when the pointer is genuinely close to it.
        // The former long-distance progress snap made corners feel magnetic.
        const pointerPassedJunction = best.sweptDist <= SNAP_RADIUS &&
          best.sweptT > consumedT + 0.02 && best.alignment > 0.12;
        if (best.dist > SNAP_RADIUS && !pointerPassedJunction) break;
        if (!appendNode(best.node)) break;
        consumedT = Math.max(consumedT, best.sweptT);
      }

      lastPointerPosition = pointer;
      if (drawing && !finished) updatePreview(pointer, movement);
      else previewPosition = null;
      queueDraw();
    }

    function completeAttempt() {
      drawing = false;
      finished = true;
      previewPosition = null;

      // Conditions 1–8 are evaluated together only when the route reaches G.
      const checks = checkRules(path);
      const pinkSeparated = pinkIsSeparated(path);

      const firstEightSatisfied = checks.every(Boolean);

      // The first route satisfying rules 1–8 records its pink arrangement and
      // reveals the ninth dot. Keep the completed line in place for a manual reset.
      if (!ninthUnlocked && firstEightSatisfied) {
        ninthUnlocked = true;
        firstPinkSeparated = pinkSeparated;
        indicatorState = [...checks, false];
        renderIndicators({ revealNinth: true, cascadeCount: 8 });
        return;
      }

      if (ninthUnlocked) {
        // Rule 9 is independent: it may light even when rules 1–8 are incomplete.
        // It requires the opposite pink-region arrangement from the first valid route.
        const ninthSatisfied = pinkSeparated !== firstPinkSeparated;
        indicatorState = [...checks, ninthSatisfied];

        const allNineSatisfied = firstEightSatisfied && ninthSatisfied;
        renderIndicators({ cascadeCount: allNineSatisfied ? 9 : (firstEightSatisfied ? 8 : 0) });

        if (allNineSatisfied) {
          resetButton.disabled = true;
          // Let the left-to-right light sequence finish before showing CLEAR.
          const cascadeEnd = 8 * 82 + 260;
          window.setTimeout(() => {
            clearScreen.hidden = false;
          }, cascadeEnd);
        }
        return;
      }

      indicatorState = checks.slice();
      renderIndicators({ cascadeCount: firstEightSatisfied ? 8 : 0 });
    }

    function startDrawing(event) {
      if (clearScreen.hidden === false || finished) return;
      const pointer = pointToSvg(event);
      if (!path.length) {
        if (distance([pointer.x, pointer.y], point(START)) > 35) return;
        path = [START.slice()];
      } else {
        const currentPoint = point(path[path.length - 1]);
        if (distance([pointer.x, pointer.y], currentPoint) > 43) return;
      }
      drawing = true;
      activePointerId = event.pointerId;
      lastPointerPosition = [pointer.x, pointer.y];
      previewPosition = null;
      try { board.setPointerCapture(event.pointerId); } catch (_) { /* Some browsers may not support capture. */ }
      queueDraw();
      event.preventDefault();
    }

    function moveDrawing(event) {
      if (!drawing || event.pointerId !== activePointerId || finished) return;
      const samples = typeof event.getCoalescedEvents === 'function'
        ? event.getCoalescedEvents()
        : [event];
      for (const sample of samples) {
        const p = pointToSvg(sample);
        processPointerPosition([p.x, p.y]);
        if (finished) break;
      }
      event.preventDefault();
    }

    function stopDrawing(event) {
      if (!drawing) return;
      if (activePointerId !== null && event && event.pointerId !== activePointerId) return;

      let releasedAtGoal = false;
      if (event && event.type === 'pointerup') {
        // Process the pointerup coordinate too, in case the last movement event
        // was not delivered separately by the browser.
        const p = pointToSvg(event);
        const releasePosition = [p.x, p.y];
        processPointerPosition(releasePosition);
        releasedAtGoal = distance(releasePosition, point(GOAL)) <= SNAP_RADIUS + 2 &&
          path.length > 0 && same(path[path.length - 1], GOAL);
      }

      drawing = false;
      activePointerId = null;
      lastPointerPosition = null;
      previewPosition = null;
      queueDraw();

      // No judgement on pointermove, pointercancel, or loss of pointer capture.
      // The player must release the pointer while it is at G.
      if (releasedAtGoal && !finished) completeAttempt();
    }

    function resetAttempt() {
      path = [];
      drawing = false;
      finished = false;
      activePointerId = null;
      lastPointerPosition = null;
      previewPosition = null;
      // Reset every visible light, but retain the hidden target pattern once
      // the ninth condition has been unlocked.
      indicatorState = Array(ninthUnlocked ? 9 : 8).fill(false);
      resetButton.disabled = false;
      renderIndicators();
      queueDraw();
    }

    function restartPuzzle() {
      ninthUnlocked = false;
      firstPinkSeparated = null;
      clearScreen.hidden = true;
      resetAttempt();
    }

    board.addEventListener('pointerdown', startDrawing);
    board.addEventListener('pointermove', moveDrawing);
    board.addEventListener('pointerup', stopDrawing);
    board.addEventListener('pointercancel', stopDrawing);
    board.addEventListener('lostpointercapture', stopDrawing);
    board.addEventListener('contextmenu', event => event.preventDefault());
    resetButton.addEventListener('click', resetAttempt);
    playAgainButton.addEventListener('click', restartPuzzle);

    drawBoard();
    renderIndicators();
    drawRoute();
  })();
  </script>
</body>
</html>
